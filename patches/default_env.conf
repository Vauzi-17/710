# Turnip Driver Environment Configuration (default_env.conf)
# Priority order:
#   1. Custom file: /sdcard/Android/data/<package_name>/files/default_env.conf
#                   or /sdcard/default_env.conf
#   2. App/Emulator environment variables (TU_DEBUG, etc.)
#   3. System property (debug.mesa.* / vendor.mesa.*)
#   4. Driver built-in compiled defaults
#
# Variables already active with default settings in the driver are commented out with '#'.
# Uncomment and modify any variable below to customize driver behavior.

# --- Memory and Texture Optimizations ---
# TU_Z_SYSMEM_ONLY=true
# TU_Z_TEXFAST=true
# TU_Z_LODBIAS=45
# TU_Z_MUTABLE=2
# TU_Z_SAFE_AMBLE=true
# TU_Z_BGRA_SWAP=true

# --- BGRA Color Channel Swap Mode ---
# 0 = Compile-time pipeline key with per-channel scalar stores (stable baseline for Switch games)
# 1 = Dynamic runtime render target swap mask (fixes color inversion in Unreal Engine games)
# 2 = Compile-time pipeline key with in-place vector swizzle (zero overhead fast path)
# TU_Z_BGRA_MODE=0

# --- On-Disk Shader Cache ---
# Set to true to enable Mesa on-disk caching in /data/data/<package>/cache
# TU_SHADER_CACHE_AUTO=false

# --- Pipeline and State Management ---
# TU_SYSMEM_RELAX_WFI=true
# TU_LRZ_PRESERVE_FS_SIDEEFFECTS=true
# TU_DRAW_STATE_SKIP_IDENTICAL=false
# TU_IR3_SCHED_LOWER_LIVE=true

# --- Host Memory and Staging Overrides ---
# Override uncached host-visible memory allocations to cached-coherent for
# DXVK / vkd3d staging buffers under x86 emulation (auto-enabled for DXVK|vkd3d).
# tu_override_uncached_as_cache_coherent=true
# TU_OVERRIDE_UNCACHED_AS_CACHE_COHERENT=true

# --- Sample Shading ---
# Only escalate fragment shader to per-sample interpolation when the shader
# statically uses sample rate inputs (avoids multi-sample shading overhead).
# TU_SAMPLE_SHADING_GATE=true

# --- Raster Order and Synchronization ---
# Bypass redundant COLOR_ATTACHMENT_OUTPUT -> FRAGMENT_SHADER intra-subpass barriers
# when raster_order_attachment_access is active on the subpass.
# TU_SKIP_RAST_ORDER_BARRIERS=true

# Relaxation of single_prim_mode when raster_order_attachment_access is enabled:
# 0 = NO_FLUSH (relaxed fast path, optimal for single-CCU hardware like Adreno 710 and 810)
# 1 = FLUSH_PER_OVERLAP (upstream default)
# TU_RAST_ORDER_PRIM_MODE=0

# --- LRZ and Geometry Optimizations ---
# When stencil test may kill fragments, disable LRZ write for the current draw call only
# instead of permanently killing LRZ writes for the entire renderpass.
# TU_LRZ_NO_STICKY_STENCIL_DISABLE=true

# Avoid redundant vertex buffer draw state allocations and CP_SET_DRAW_STATE emissions
# by deduplicating incoming vertex buffer bindings (IOVA base, size, stride).
# TU_VB_DEDUP=true
