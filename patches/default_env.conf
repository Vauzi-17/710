# Default environment variables built into the driver (read by
# 20-default-env.py at build time). For emulators and launchers that have no
# environment-variable setting.
#
# One NAME=VALUE per line. Lines starting with # are ignored.
# A value set by the app/emulator or a debug.mesa.* property still wins;
# these only fill in what nothing else set.
#
# Examples:
#   TU_DEBUG=sysmem
#   IR3_SHADER_DEBUG=nodescprefetch
#   TU_TEXFAST=0
#   MESA_VK_WSI_PRESENT_MODE=mailbox

TU_DEBUG=sysmem
