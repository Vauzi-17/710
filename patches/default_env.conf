# Default environment variables built into the driver (read by
# 20-default-env.py at build time). For emulators and launchers that have no
# environment-variable setting.
#
# One NAME=VALUE per line. Lines starting with # are ignored.
# A value set by the app/emulator or a debug.mesa.* property still wins;
# these only fill in what nothing else set.

# Performance defaults for Switch emulation (Sysmem + TexFast + Mutable UBWC)
TU_Z_SYSMEM_ONLY=true
TU_Z_TEXFAST=true
TU_Z_LODBIAS=45
TU_Z_MUTABLE=2
TU_Z_SAFE_AMBLE=true
TU_Z_BGRA_SWAP=true

# Pipeline and state management defaults
TU_SYSMEM_RELAX_WFI=true
TU_LRZ_PRESERVE_FS_SIDEEFFECTS=true
TU_DRAW_STATE_SKIP_IDENTICAL=true
TU_IR3_SCHED_LOWER_LIVE=true
