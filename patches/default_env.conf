# Turnip Driver Environment Configuration (default_env.conf)
# Priority order:
#   1. Custom file: /sdcard/Android/data/<package_name>/files/default_env.conf
#                   or /sdcard/default_env.conf
#   2. App/Emulator environment variables (TU_DEBUG, etc.)
#   3. System property (debug.mesa.* / vendor.mesa.*)
#   4. Driver built-in compiled defaults
#
# Variables already active with default settings in the driver are commented out with '#'.
# Uncomment and modify any variable below to customize driver behavior.

# --- Switch & Performance Optimizations ---
# TU_Z_SYSMEM_ONLY=true
# TU_Z_TEXFAST=true
# TU_Z_LODBIAS=45
# TU_Z_MUTABLE=2
# TU_Z_SAFE_AMBLE=true
# TU_Z_BGRA_SWAP=true

# --- BGRA Color Fix Mode (TurnipZ 0.3.0 Feature Selection) ---
# 0 = sw default (baseline compile-time key, per-channel scalar stores, proven Switch baseline)
# 1 = turnipz3 port (dynamic sysval load_rt_swap_mask_ir3, fixes Unreal Engine games)
# 2 = perbaikan / optimized (compile-time key, in-place vec4 SSA swizzle, zero FPS regression)
# TU_Z_BGRA_MODE=0

# --- Mesa On-Disk Shader Cache ---
# Set to true to enable disk caching in /data/data/<package>/cache
# TU_SHADER_CACHE_AUTO=false

# --- Pipeline and State Management ---
# TU_SYSMEM_RELAX_WFI=false
# TU_LRZ_PRESERVE_FS_SIDEEFFECTS=false
# TU_LRZ_PRESERVE_DIR_CHANGE=true
# TU_DRAW_STATE_SKIP_IDENTICAL=false
# TU_IR3_SCHED_LOWER_LIVE=true
