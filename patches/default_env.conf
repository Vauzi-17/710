# Default environment variables built into the driver (read by
# 20-default-env.py at build time). For emulators and launchers that have no
# environment-variable setting.
#
# One NAME=VALUE per line. Lines starting with # are ignored.
# A value set by the app/emulator or a debug.mesa.* property still wins;
# these only fill in what nothing else set.

# Performance defaults for Switch emulation (Sysmem + TexFast + Mutable UBWC)
TU_Z_SYSMEM_ONLY=true
TU_Z_TEXFAST=true
TU_Z_LODBIAS=45
TU_Z_MUTABLE=2
TU_Z_SAFE_AMBLE=true
TU_Z_BGRA_SWAP=true

# BGRA Color Fix Mode (TurnipZ 0.3.0 feature selection):
# 0 = sw default (baseline compile-time key, per-channel scalar stores, proven Switch baseline)
# 1 = turnipz3 port (dynamic sysval load_rt_swap_mask_ir3, fixes Unreal Engine games)
# 2 = perbaikan / optimized (compile-time key, in-place vec4 SSA swizzle, zero FPS regression)
TU_Z_BGRA_MODE=0

# Mesa on-disk shader cache (TurnipZ 0.3.0 feature)
# Set to true to enable disk caching in /data/data/<package>/cache/mesa_shader_cache
# Default false to avoid lock contention or conflicts with emulator internal pipeline cache
TU_SHADER_CACHE_AUTO=false

# Pipeline and state management defaults
TU_SYSMEM_RELAX_WFI=true
TU_LRZ_PRESERVE_FS_SIDEEFFECTS=true
TU_LRZ_PRESERVE_DIR_CHANGE=true
TU_DRAW_STATE_SKIP_IDENTICAL=true
TU_IR3_SCHED_LOWER_LIVE=true
