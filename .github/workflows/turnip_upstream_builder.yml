name: Build "turnip upstream"
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: true
        type: string
jobs:
  start_building_turnip:
    runs-on: ubuntu-24.04
    env:
      BUILD_VERSION: ${{ inputs.version }}
    steps:
    - uses: actions/checkout@v3
    - name: Prepare environment
      run: |
        sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
        sudo apt update
        sudo apt install build-essential flex bison glslang-tools
        sudo apt install meson-1.5
    - name: Execute build script
      run: bash ./turnip_builder_upstream.sh
    - name: Release "turnip upstream"
      uses: softprops/action-gh-release@v1
      with:
        body: |
          Turnip Adreno 710 (Upstream Mesa) v${{ inputs.version }}
          Built from: https://gitlab.freedesktop.org/mesa/mesa (main branch)
          Patch: https://github.com/whitebelyash/mesa-tu8 (tu8_kgsl.patch)
          A710 patch applied on top.

          >[!WARNING]
          > Experimental. Do NOT report issues to Mesa upstream.

          Supported GPU:
          - Adreno 710 (Snapdragon 6 Gen 1 / SM6450)
        tag_name: tu_upstream_v${{ inputs.version }}
        name: Turnip Upstream A710 v${{ inputs.version }}
        files: |
          /tmp/mesa-turnip-main-V${{ inputs.version }}.zip
